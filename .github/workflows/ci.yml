---
name: Validation

on:
  push:
    branches: [main, master, default]
  pull_request:
    branches: [main, master, default]
  schedule:
    # Weekly on Sundays to catch upstream breakage
    - cron: "0 4 * * 0"
  workflow_dispatch:

env:
  # This forces all JS actions (like checkout) to run on Node 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdown-Lint
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install markdownlint
        run: |
          sudo npm install -g markdownlint-cli
      - name: Run markdownlint
        run: markdownlint .

  yamllint:
    name: YAML-Lint
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run yamllint
        run: yamllint .

  spellcheck:
    name: Spellcheck
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run spellcheck
        run: codespell .

  # Summary gate for branch protection
  ci-pass:
    name: Validation Passed
    runs-on: [self-hosted, linux, x64]
    needs: [markdownlint, yamllint, spellcheck]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.ansible-lint.result }}" != "success" ]] || \
          [[ "${{ needs.jinja2-lint.result }}" != "success" ]] || \
          [[ "${{ needs.markdownlint.result }}" != "success" ]] || \
          [[ "${{ needs.yamllint.result }}" != "success" ]] || \
          [[ "${{ needs.shellcheck.result }}" != "success" ]] || \
          [[ "${{ needs.spellcheck.result }}" != "success" ]]; then
          echo "::error::One or more jobs failed"
          exit 1
          fi
          echo "All jobs passed!"
